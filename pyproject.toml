[project]
name = "test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "dotenv>=0.9.9",
    "fastapi>=0.128.8",
    "gunicorn>=22.0.0",
    "greenlet>=3.3.1",
    "httpx>=0.28.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.46",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "mypy>=1.19.1",
    "ruff>=0.15.0",
    "pre-commit>=4.0.0",  # Добавляем pre-commit
    "pytest-cov>=5.0",
    "types-sqlalchemy",
]

# Настройки mypy — теперь прямо в pyproject.toml!
[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"

# Исключаем папки
exclude = [
    ".venv",
    "venv",
    ".git",
    "__pycache__",
    ".mypy_cache",
    "build",
    "dist",
    "tests",
]

# Опционально: строгие правила
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

# Если используешь FastAPI/SQLAlchemy — можно добавить игноры
[[tool.mypy.overrides]]
module = [
    "sqlalchemy.*",
    "fastapi.*",
    "pydantic.*",
    "tests",
]
ignore_missing_imports = true
follow_imports = "skip"


# Black — уже хорошо, оставим как есть
[tool.black]
line-length = 72
target-version = ['py313']  # обновлено под твой Python 3.13
include = '\.py$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

# Ruff — немного поправим
[tool.ruff]
line-length = 72  # Лучше синхронизировать с black
select = [
    "E",   # pycodestyle
    "W",   # warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # Теперь не нужен — line-length = 88
target-version = "py313"

[tool.ruff.isort]
combine-as-imports = true

[tool.ruff.flake8-bugbear]
extend-immutable-calls = []
